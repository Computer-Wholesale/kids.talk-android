name: KID-407 Unprivileged Contract

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/KID-407-protected-firebase-client-binding-main
      - main
      - release/kid407-uat

permissions:
  contents: read

jobs:
  no-fcm-contract:
    name: KID-407 unprivileged no-FCM contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure no-FCM build inputs
        shell: bash
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew

      - name: Run KID-407 contract tests
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test_kid407_firebase_contract.sh
          bash scripts/test_kid407_protected_workflow.sh
          bash scripts/test_kid407_unprivileged_workflow.sh

      - name: Run no-FCM build gates
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest :app:compileDebugKotlin :app:lint --no-daemon --max-workers=1 -Dorg.gradle.jvmargs='-Xmx2048m' --console=plain

name: KID-267 Unprivileged Signing Contract

on:
  pull_request:
    branches:
      - main
      - release/kid407-uat
  push:
    branches:
      - feature/KID-267-fail-closed-upload-signing
      - main
      - release/kid407-uat

permissions:
  contents: read

jobs:
  fail-closed-signing-contract:
    name: KID-267 unprivileged fail-closed signing checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure no-FCM build inputs
        shell: bash
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew

      - name: Run KID-267 signing and workflow contracts
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test_kid267_signing_contract.sh
          bash scripts/test_kid267_protected_workflow.sh
          bash scripts/test_kid267_unprivileged_workflow.sh

      - name: Run KID-267 behavioral signing preflight coverage
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test_kid267_behavioral_preflight.sh

      - name: Run safe no-FCM configuration and build gates
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test_kid407_firebase_contract.sh
          bash scripts/test_kid407_protected_workflow.sh
          bash scripts/test_kid407_unprivileged_workflow.sh
          ./gradlew :app:testDebugUnitTest :app:compileDebugKotlin :app:compileReleaseKotlin :app:lintDebug :app:lintRelease --no-daemon --max-workers=1 -Dorg.gradle.jvmargs='-Xmx1536m' -Dkotlin.compiler.execution.strategy=in-process --console=plain
